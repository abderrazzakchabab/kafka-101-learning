version: "3.8"

networks:
  kafka-net:
    driver: bridge

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-learn-broker
    networks:
      - kafka-net
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-shell:
    build:
      context: ./docker/kafka-shell
    container_name: kafka-learn-shell
    networks:
      - kafka-net
    ports:
      - "7681:7681"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  webapp:
    build:
      context: .
      dockerfile: docker/webapp/Dockerfile
    container_name: kafka-learn-webapp
    networks:
      - kafka-net
    ports:
      - "3000:3000"
    depends_on:
      - kafka-shell
    environment:
      NEXT_PUBLIC_TTYD_URL: http://localhost:7681
